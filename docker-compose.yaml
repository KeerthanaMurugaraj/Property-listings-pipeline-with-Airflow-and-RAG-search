# The whole deployment on one machine:  docker compose up --build
# UI: http://localhost:8088   (8088, so it does not clash with `airflow standalone` on 8080)

x-airflow: &airflow
  build: .
  image: listings-airflow:latest
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    # Airflow's own database is Postgres now, not a SQLite file.
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "False"
    # Tasks report to the api-server over the network, so they need its address...
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://api-server:8080/execution/
    # ...and all services must share one secret to trust each other.
    AIRFLOW__API_AUTH__JWT_SECRET: local-learning-secret-change-me
    # Local learning setup only: skip the login screen.
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "True"
    # A connection given through the environment. The DAG still calls Connection.get("agency_b").
    AIRFLOW_CONN_AGENCY_B: http://agency-b:8081
  volumes:
    - airflow-logs:/opt/airflow/logs
    - pipeline-data:/opt/airflow/pipeline-data
  depends_on: &airflow-depends
    postgres:
      condition: service_healthy
    airflow-init:
      condition: service_completed_successfully

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 10

  # Runs once: creates Airflow's tables in Postgres, then exits.
  airflow-init:
    <<: *airflow
    command: db migrate
    depends_on:
      postgres:
        condition: service_healthy

  api-server:
    <<: *airflow
    command: api-server
    ports:
      - "8088:8080"

  scheduler:
    <<: *airflow
    command: scheduler

  dag-processor:
    <<: *airflow
    command: dag-processor

  # The simulated agency. In real life this is somebody else's server.
  agency-b:
    build: .
    image: listings-airflow:latest
    command: python -m sources.api
    environment:
      AGENCY_B_HOST: 0.0.0.0

volumes:
  postgres-data:
  airflow-logs:
  pipeline-data:
